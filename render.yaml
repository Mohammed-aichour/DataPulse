# Render Web Service Blueprint for DataPulse
# FastAPI Web Service connected to Cloud PostgreSQL (Neon.tech perpetual free tier)
services:
  - type: web
    name: datapulse-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install -e .
    startCommand: sh -c "alembic upgrade head && python scripts/init_db.py && python -m etl.run && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://datapulse-opal.vercel.app,https://datapulse-modo11.vercel.app,http://localhost:3000,*"
