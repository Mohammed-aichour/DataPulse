# Render Infrastructure-as-Code Blueprint for DataPulse
# Deploys Managed PostgreSQL 16 + FastAPI Web Service with automated migrations and ETL
services:
  - type: web
    name: datapulse-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install -e .
    startCommand: sh -c "alembic upgrade head && python scripts/init_db.py && python -m etl.run && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: datapulse-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://datapulse-opal.vercel.app,https://datapulse-modo11.vercel.app,http://localhost:3000,*"

databases:
  - name: datapulse-db
    databaseName: datapulse
    user: datapulse_user
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
