version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: datapulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse_db}
    # Bind strictly to loopback interface 127.0.0.1 to prevent public network exposure
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapulse_user} -d ${POSTGRES_DB:-datapulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapulse_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-datapulse_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-datapulse_db}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be set in your .env file}
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:80"]'
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datapulse_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
    driver: local
